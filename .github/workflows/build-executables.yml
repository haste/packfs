name: Build and release executables

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install build tools
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          cache: true

      - name: Set version from tag
        if: github.ref_type == 'tag'
        run: echo "PACKFS_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore Mix check cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build/dev
            _build/test
          key: ${{ runner.os }}-mix-check-${{ hashFiles('mix.lock', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-mix-check-

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch dependencies
        run: mix deps.get

      - name: Run checks
        run: mise run check

  build:
    name: Build ${{ matrix.target }}
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux_x86_64
            executable: burrito_out/packfs_linux_x86_64
          - target: windows_x86_64
            executable: burrito_out/packfs_windows_x86_64.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Burrito system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes p7zip-full xz-utils

      - name: Install build tools
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          cache: true

      - name: Set version from tag
        if: github.ref_type == 'tag'
        run: echo "PACKFS_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore Mix build cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build/prod/lib
          key: ${{ runner.os }}-mix-prod-${{ hashFiles('mix.lock', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-mix-prod-

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch production dependencies
        env:
          MIX_ENV: prod
        run: mix deps.get --only prod

      - name: Build executable
        env:
          BURRITO_TARGET: ${{ matrix.target }}
          MIX_ENV: prod
        run: mix release --overwrite

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.executable }}
          archive: false
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download executables
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum packfs_* > SHA256SUMS

      - name: Publish release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --title "PackFS $GITHUB_REF_NAME"
